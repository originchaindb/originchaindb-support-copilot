name: Bug report
description: Report a reproducible starter problem using synthetic data.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and a sanitized error. Never include tokens or customer data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include OS, Python version, model names, and a small fictional input.
    validations:
      required: true
