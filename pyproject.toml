[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "originchaindb-support-copilot"
version = "0.1.0"
description = "A source-citing support copilot for SaaS founders, using OriginChainDB and local AI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx==0.28.1",
  "fastapi==0.135.1",
  "uvicorn==0.41.0",
  "python-dotenv==1.2.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.16.0"]

[project.scripts]
support-copilot = "support_copilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["support_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
